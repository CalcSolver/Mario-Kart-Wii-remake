<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Kart Wii Remake - Moonview Highway</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* HUD Header Panel */
    #ui-hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 18px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      min-width: 280px;
      pointer-events: none;
    }

    .game-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .track-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .status-indicator.ready {
      background-color: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .status-text {
      font-size: 0.82rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #cbd5e1;
    }

    /* Progress Bar */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #4ade80);
      transition: width 0.2s ease-out;
    }

    /* Speedometer Dashboard */
    #speedometer-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .speed-number {
      font-size: 2.8rem;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #f8fafc;
      line-height: 1;
    }

    .speed-unit {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    /* Controls Legend Overlay */
    #controls-hint {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.82rem;
      color: #e2e8f0;
      display: flex;
      gap: 16px;
      align-items: center;
      pointer-events: none;
    }

    .key-badge {
      background: #334155;
      color: #f8fafc;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

  <!-- HUD HTML Structure -->
  <div id="ui-hud">
    <div class="game-title">MARIO KART WII</div>
    <div class="track-subtitle">Moonview Highway Remake</div>
    <div class="status-container">
      <div id="status-dot" class="status-indicator"></div>
      <div id="status-text" class="status-text">Initializing Engine...</div>
    </div>
    <div class="progress-bar-bg">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div id="speedometer-panel">
    <div id="speed-display" class="speed-number">00</div>
    <div class="speed-unit">KM/H</div>
  </div>

  <div id="controls-hint">
    <div><span class="key-badge">W</span> <span class="key-badge">S</span> / <span class="key-badge">↑</span> <span class="key-badge">↓</span> Accelerate / Reverse</div>
    <div><span class="key-badge">A</span> <span class="key-badge">D</span> / <span class="key-badge">←</span> <span class="key-badge">→</span> Steer</div>
    <div><span class="key-badge">SPACE</span> Brake</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // GitHub Repository Asset Base Path
    const GITHUB_BASE_URL = 'https://raw.githubusercontent.com/CalcSolver/Mario-Kart-Wii-remake/main/';
    const MODEL_FILENAME = 'scene.gltf';

    // DOM UI elements
    const container = document.getElementById('canvas-container');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const progressFill = document.getElementById('progress-fill');
    const speedDisplay = document.getElementById('speed-display');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e17);
    scene.fog = new THREE.FogExp2(0x0a0e17, 0.0015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Dynamic Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 2.5);
    dirLight.position.set(150, 300, 150);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 1000;
    scene.add(dirLight);

    const hemiLight = new THREE.HemisphereLight(0x38bdf8, 0x1e293b, 1.0);
    scene.add(hemiLight);

    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const wheelMeshes = [];

    function buildKartAndMario() {
      // 1. Kart Chassis
      const chassisGeo = new THREE.BoxGeometry(2.4, 0.7, 3.8);
      const chassisMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.8 });
      const chassis = new THREE.Mesh(chassisGeo, chassisMat);
      chassis.position.y = 0.6;
      chassis.castShadow = true;
      playerGroup.add(chassis);

      // Kart Front Nose
      const noseGeo = new THREE.ConeGeometry(1.2, 1.4, 16);
      const noseMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.8 });
      const nose = new THREE.Mesh(noseGeo, noseMat);
      nose.rotation.x = Math.PI / 2;
      nose.position.set(0, 0.55, 2.3);
      playerGroup.add(nose);

      // Exhaust Pipes
      const pipeGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.8, 12);
      const pipeMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.9, roughness: 0.1 });
      const pipe1 = new THREE.Mesh(pipeGeo, pipeMat);
      pipe1.position.set(-0.6, 0.8, -1.9);
      pipe1.rotation.x = -Math.PI / 6;
      playerGroup.add(pipe1);

      const pipe2 = pipe1.clone();
      pipe2.position.x = 0.6;
      playerGroup.add(pipe2);

      // Steering Wheel
      const wheelRingGeo = new THREE.TorusGeometry(0.32, 0.06, 8, 20);
      const wheelRingMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
      const steeringWheel = new THREE.Mesh(wheelRingGeo, wheelRingMat);
      steeringWheel.rotation.x = Math.PI / 3;
      steeringWheel.position.set(0, 1.15, 0.8);
      playerGroup.add(steeringWheel);

      // Kart Wheels
      const tireGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.45, 24);
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
      const rimGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.47, 16);
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.8, roughness: 0.2 });

      const wheelOffsets = [
        [-1.35, 0.52, 1.3],
        [1.35, 0.52, 1.3],
        [-1.35, 0.52, -1.3],
        [1.35, 0.52, -1.3]
      ];

      wheelOffsets.forEach(pos => {
        const wheelPivot = new THREE.Group();
        wheelPivot.position.set(...pos);

        const tireMesh = new THREE.Mesh(tireGeo, tireMat);
        tireMesh.rotation.z = Math.PI / 2;
        tireMesh.castShadow = true;
        wheelPivot.add(tireMesh);

        const rimMesh = new THREE.Mesh(rimGeo, rimMat);
        rimMesh.rotation.z = Math.PI / 2;
        wheelPivot.add(rimMesh);

        playerGroup.add(wheelPivot);
        wheelMeshes.push(wheelPivot);
      });

      // 2. Mario Character Driver
      const marioGroup = new THREE.Group();
      marioGroup.position.set(0, 0.85, -0.1);

      // Materials
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcca0, roughness: 0.6 });
      const redCapMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 });
      const blueOverallsMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.5 });
      const brownMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.7 });
      const whiteGloveMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });

      // Head
      const headGeo = new THREE.SphereGeometry(0.42, 16, 16);
      const head = new THREE.Mesh(headGeo, skinMat);
      head.position.y = 1.0;
      marioGroup.add(head);

      // Nose
      const noseCharGeo = new THREE.SphereGeometry(0.18, 12, 12);
      const noseChar = new THREE.Mesh(noseCharGeo, skinMat);
      noseChar.position.set(0, 1.02, 0.4);
      marioGroup.add(noseChar);

      // Mustache
      const mustacheGeo = new THREE.BoxGeometry(0.42, 0.12, 0.15);
      const mustache = new THREE.Mesh(mustacheGeo, brownMat);
      mustache.position.set(0, 0.92, 0.42);
      marioGroup.add(mustache);

      // Red Cap
      const capGeo = new THREE.SphereGeometry(0.45, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const cap = new THREE.Mesh(capGeo, redCapMat);
      cap.position.set(0, 1.05, 0);
      marioGroup.add(cap);

      // Cap Visor Brim
      const brimGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.04, 16, 1, false, -Math.PI / 3, Math.PI / 1.5);
      const brim = new THREE.Mesh(brimGeo, redCapMat);
      brim.position.set(0, 1.08, 0.22);
      brim.rotation.x = 0.2;
      marioGroup.add(brim);

      // Torso (Shirt + Overalls)
      const torsoGeo = new THREE.CylinderGeometry(0.38, 0.42, 0.75, 16);
      const torso = new THREE.Mesh(torsoGeo, blueOverallsMat);
      torso.position.y = 0.42;
      marioGroup.add(torso);

      // Arms extending to wheel
      const armGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.55);
      
      const leftArm = new THREE.Mesh(armGeo, redCapMat);
      leftArm.position.set(-0.38, 0.55, 0.3);
      leftArm.rotation.set(Math.PI / 3, 0, -Math.PI / 6);
      marioGroup.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, redCapMat);
      rightArm.position.set(0.38, 0.55, 0.3);
      rightArm.rotation.set(Math.PI / 3, 0, Math.PI / 6);
      marioGroup.add(rightArm);

      // Hands/Gloves
      const gloveGeo = new THREE.SphereGeometry(0.14, 12, 12);
      const leftGlove = new THREE.Mesh(gloveGeo, whiteGloveMat);
      leftGlove.position.set(-0.28, 0.4, 0.72);
      marioGroup.add(leftGlove);

      const rightGlove = new THREE.Mesh(gloveGeo, whiteGloveMat);
      rightGlove.position.set(0.28, 0.4, 0.72);
      marioGroup.add(rightGlove);

      playerGroup.add(marioGroup);
    }

    buildKartAndMario();

    window.loadMarioOBJ = function(objUrl, mtlUrl = null) {
      statusText.innerText = "Loading custom Mario OBJ...";
      if (mtlUrl) {
        const mtlLoader = new THREE.MTLLoader();
        mtlLoader.load(mtlUrl, (materials) => {
          materials.preload();
          const objLoader = new THREE.OBJLoader();
          objLoader.setMaterials(materials);
          objLoader.load(objUrl, (object) => {
            playerGroup.children = playerGroup.children.filter(c => !(c instanceof THREE.Group && c.position.y > 0.8));
            object.scale.set(0.6, 0.6, 0.6);
            object.position.set(0, 0.85, -0.1);
            playerGroup.add(object);
            statusText.innerText = "Custom Mario OBJ loaded!";
          });
        });
      } else {
        const objLoader = new THREE.OBJLoader();
        objLoader.load(objUrl, (object) => {
          playerGroup.children = playerGroup.children.filter(c => !(c instanceof THREE.Group && c.position.y > 0.8));
          object.scale.set(0.6, 0.6, 0.6);
          object.position.set(0, 0.85, -0.1);
          playerGroup.add(object);
          statusText.innerText = "Custom Mario OBJ loaded!";
        });
      }
    };

    let speed = 0;
    let maxSpeed = 1.45;
    let reverseSpeed = -0.5;
    let acceleration = 0.035;
    let friction = 0.965;
    let turnSpeed = 0.038;

    const keys = { forward: false, backward: false, left: false, right: false, brake: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === ' ') keys.brake = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
      if (e.key === ' ') keys.brake = false;
    });

    const loadingManager = new THREE.LoadingManager();

    // Map internal GLTF texture/bin relative paths directly to GitHub root
    loadingManager.setURLModifier((url) => {
      if (url.startsWith('data:') || url.startsWith('http://') || url.startsWith('https://')) {
        return url;
      }
      const cleanPath = url.replace(/^(\/|\.\/)/, '');
      return GITHUB_BASE_URL + cleanPath;
    });

    const gltfLoader = new THREE.GLTFLoader(loadingManager);
    gltfLoader.setCrossOrigin('anonymous');

    statusText.innerText = "Downloading Moonview Highway...";

    const fullModelUrl = GITHUB_BASE_URL + MODEL_FILENAME;

    gltfLoader.load(
      fullModelUrl,
      (gltf) => {
        const trackModel = gltf.scene;

        // Calculate Bounding Box to auto-scale track for fast gameplay
        const bbox = new THREE.Box3().setFromObject(trackModel);
        const center = bbox.getCenter(new THREE.Vector3());
        
        // Scale factor for optimal track driving proportions
        const scaleFactor = 110.0;
        trackModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

        // Position track centered under the kart
        trackModel.position.x = -center.x * scaleFactor;
        trackModel.position.y = -bbox.min.y * scaleFactor;
        trackModel.position.z = -center.z * scaleFactor;

        // Enhance texture materials and double sided rendering
        trackModel.traverse((child) => {
          if (child.isMesh) {
            child.receiveShadow = true;
            child.castShadow = true;
            if (child.material) {
              child.material.side = THREE.DoubleSide;
              child.material.depthWrite = true;
            }
          }
        });

        scene.add(trackModel);

        // Position Kart onto main road surface
        playerGroup.position.set(0, 1.2, 0);

        statusText.innerText = "Moonview Highway Ready!";
        statusDot.classList.add('ready');
        progressFill.style.width = '100%';
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          statusText.innerText = `Loading Track Assets: ${percent}%`;
          progressFill.style.width = `${percent}%`;
        }
      },
      (error) => {
        console.error("GLTF Load Error:", error);
        statusText.innerText = "Error loading GLTF from GitHub.";
      }
    );

    let currentTilt = 0;

    function updatePhysics() {
      // Acceleration & Braking
      if (keys.forward) {
        speed += acceleration;
        if (speed > maxSpeed) speed = maxSpeed;
      } else if (keys.backward) {
        speed -= acceleration;
        if (speed < reverseSpeed) speed = reverseSpeed;
      } else {
        speed *= friction;
      }

      if (keys.brake) {
        speed *= 0.82;
      }

      // Steering
      if (Math.abs(speed) > 0.01) {
        const dir = speed > 0 ? 1 : -1;
        if (keys.left) {
          playerGroup.rotation.y += turnSpeed * dir;
          currentTilt = THREE.MathUtils.lerp(currentTilt, 0.15, 0.1);
        } else if (keys.right) {
          playerGroup.rotation.y -= turnSpeed * dir;
          currentTilt = THREE.MathUtils.lerp(currentTilt, -0.15, 0.1);
        } else {
          currentTilt = THREE.MathUtils.lerp(currentTilt, 0, 0.1);
        }
      } else {
        currentTilt = THREE.MathUtils.lerp(currentTilt, 0, 0.1);
      }

      playerGroup.rotation.z = currentTilt;
      playerGroup.translateZ(speed);

      // Rotate Kart Wheels
      wheelMeshes.forEach(wheel => {
        wheel.children[0].rotation.x += speed * 0.8;
      });

      // Update Speedometer UI
      const displayKmh = Math.floor(Math.abs(speed) * 90);
      speedDisplay.innerText = displayKmh < 10 ? `0${displayKmh}` : displayKmh;

      // Smooth Follow Camera
      const relativeCameraOffset = new THREE.Vector3(0, 6.5, -14.5);
      const cameraPosition = relativeCameraOffset.applyMatrix4(playerGroup.matrixWorld);
      
      camera.position.lerp(cameraPosition, 0.12);
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.8, playerGroup.position.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
