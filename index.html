<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Kart Wii - Moonview Highway</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030712;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 360px;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: #38bdf8;
    }

    p {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .status {
      margin-top: 10px;
      font-size: 0.8rem;
      font-family: monospace;
      color: #4ade80;
    }

    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <h1>Mario Kart Wii Remake</h1>
    <p>Moonview Highway Night Circuit</p>
    <div class="status" id="loading-status">Status: Ready to Drive!</div>
  </div>

  <div id="controls-hint">
    🎮 <b>Controls:</b> WASD / Arrow Keys to Drive | Space to Brake
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');

    // ==========================================
    // 1. SCENE, CAMERA & RENDERER
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.005);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Ambient Moonlight
    const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.6);
    scene.add(ambientLight);

    // Moon Light Source
    const moonLight = new THREE.DirectionalLight(0x93c5fd, 1.2);
    moonLight.position.set(50, 150, -100);
    moonLight.castShadow = true;
    scene.add(moonLight);

    // ==========================================
    // 2. MOONVIEW HIGHWAY ENVIRONMENT
    // ==========================================
    // Road Surface
    const roadWidth = 24;
    const roadLength = 1000;
    const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    scene.add(road);

    // Yellow Center Lines
    const lineGeo = new THREE.PlaneGeometry(0.4, 4);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    for (let z = -roadLength / 2; z < roadLength / 2; z += 12) {
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.01, z);
      scene.add(line);
    }

    // Highway Barriers
    const barrierGeo = new THREE.BoxGeometry(0.8, 1.2, roadLength);
    const barrierMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.5 });
    
    const leftBarrier = new THREE.Mesh(barrierGeo, barrierMat);
    leftBarrier.position.set(-roadWidth / 2, 0.6, 0);
    scene.add(leftBarrier);

    const rightBarrier = new THREE.Mesh(barrierGeo, barrierMat);
    rightBarrier.position.set(roadWidth / 2, 0.6, 0);
    scene.add(rightBarrier);

    // Overhead Streetlights
    const poleGeo = new THREE.CylinderGeometry(0.15, 0.15, 8);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
    for (let z = -roadLength / 2; z < roadLength / 2; z += 40) {
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.set(-roadWidth / 2 - 1, 4, z);
      scene.add(pole);

      const light = new THREE.PointLight(0xfde047, 1.5, 25);
      light.position.set(-roadWidth / 2 + 2, 7.5, z);
      scene.add(light);
    }

    // ==========================================
    // 3. PLAYER KART BUILD & HEADLIGHTS
    // ==========================================
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    // Main Kart Body
    const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 2.8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2, metalness: 0.3 });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.position.y = 0.5;
    bodyMesh.castShadow = true;
    playerGroup.add(bodyMesh);

    // Driver Seat
    const cabinGeo = new THREE.SphereGeometry(0.6, 16, 16);
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1 });
    const cabinMesh = new THREE.Mesh(cabinGeo, cabinMat);
    cabinMesh.position.set(0, 0.9, -0.2);
    playerGroup.add(cabinMesh);

    // Kart Headlights
    const leftSpot = new THREE.SpotLight(0xffffff, 3, 40, Math.PI / 6, 0.5);
    leftSpot.position.set(-0.6, 0.6, 1.4);
    leftSpot.target.position.set(-0.6, 0, 10);
    playerGroup.add(leftSpot);
    playerGroup.add(leftSpot.target);

    const rightSpot = new THREE.SpotLight(0xffffff, 3, 40, Math.PI / 6, 0.5);
    rightSpot.position.set(0.6, 0.6, 1.4);
    rightSpot.target.position.set(0.6, 0, 10);
    playerGroup.add(rightSpot);
    playerGroup.add(rightSpot.target);

    playerGroup.position.set(0, 0, 0);

    // ==========================================
    // 4. DRIVING PHYSICS & CONTROLS
    // ==========================================
    let speed = 0;
    let maxSpeed = 1.0;
    let reverseSpeed = -0.4;
    let acceleration = 0.025;
    let friction = 0.96;
    let turnSpeed = 0.035;

    const keys = { forward: false, backward: false, left: false, right: false, brake: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === ' ') keys.brake = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
      if (e.key === ' ') keys.brake = false;
    });

    // ==========================================
    // 5. ANIMATION LOOP & CHASE CAMERA
    // ==========================================
    function updatePhysics() {
      if (keys.forward) {
        speed += acceleration;
        if (speed > maxSpeed) speed = maxSpeed;
      } else if (keys.backward) {
        speed -= acceleration;
        if (speed < reverseSpeed) speed = reverseSpeed;
      } else {
        speed *= friction;
      }

      if (keys.brake) speed *= 0.85;

      if (Math.abs(speed) > 0.01) {
        const dir = speed > 0 ? 1 : -1;
        if (keys.left) playerGroup.rotation.y += turnSpeed * dir;
        if (keys.right) playerGroup.rotation.y -= turnSpeed * dir;
      }

      playerGroup.translateZ(speed);

      // Keep player on highway boundaries
      const limitX = (roadWidth / 2) - 1.5;
      if (playerGroup.position.x > limitX) playerGroup.position.x = limitX;
      if (playerGroup.position.x < -limitX) playerGroup.position.x = -limitX;

      // Camera Follow Logic
      const relativeCameraOffset = new THREE.Vector3(0, 5, -12);
      const cameraPosition = relativeCameraOffset.applyMatrix4(playerGroup.matrixWorld);
      
      camera.position.lerp(cameraPosition, 0.1);
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
